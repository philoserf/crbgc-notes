version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format markdown with prettier
    cmds:
      - prettier --list-different --ignore-unknown --write .

  llms:
    desc: Regenerate llms.txt from note frontmatter
    cmds:
      - python3 .scripts/gen-llms.py

  check:
    desc: Run all formatting checks
    deps: [fmt]
